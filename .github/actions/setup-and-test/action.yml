name: Setup and Test
description: Checkout, install Python dependencies, and run tests

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Run tests
      shell: bash
      run: pytest tests/ -v
